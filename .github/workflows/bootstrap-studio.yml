name: Bootstrap Studio Source

on:
  push:
    paths:
      - bootstrap/source.tgz.b64
      - .github/workflows/bootstrap-studio.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand Studio source
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode bootstrap/source.tgz.b64 > /tmp/ithute-document-studio.tgz
          tar -xzf /tmp/ithute-document-studio.tgz -C .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-studio.yml
      - name: Commit source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ithute-stak"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add full Ithute Document Studio foundation"
          git push origin HEAD:main
